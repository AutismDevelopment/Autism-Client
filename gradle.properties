org.gradle.jvmargs=-Xmx2G
org.gradle.configuration-cache=false
# Loom's manifest rewrite opens the output through JDK ZipFS. With Gradle 9/JDK 25, reusing the long-lived daemon
# can retain a closed ZipFileSystem and make a later forced :jar fail with ClosedFileSystemException. A fresh
# single-use process is deterministic and avoids producing a partially packaged release jar.
org.gradle.daemon=false

maven_group=com.autismclient
archives_base_name=AUTISM Client
